name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        if: runner.os != 'Windows'
        run: go test -race -coverprofile=coverage.txt ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test '-coverprofile=coverage.txt' ./...
      - name: verify Unix active Codex integration executes
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          go test -json ./internal/cli -run '^TestIntegrationPhaseThreeBinaryIsolationAndReaping$' -count=1 | tee phase3-active.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path("phase3-active.jsonl").read_text().splitlines()]
          actions = [e["Action"] for e in events if e.get("Test") == "TestIntegrationPhaseThreeBinaryIsolationAndReaping"]
          assert "pass" in actions and "skip" not in actions and "fail" not in actions, actions
          PY
      - name: build
        run: go build ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
